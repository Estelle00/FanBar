<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>撤回报告 · FanBar</title><link rel="stylesheet" href="/app.css"><script type="module" src="/withdraw.js"></script></head><body><header><div class="header"><a class="brand" href="/"><img src="/fanbar.png" alt="FanBar"><span>FanBar<small>设备兼容性 · 撤回报告</small></span></a><nav><a href="/privacy.html">处理规则</a></nav></div></header><main class="main withdraw"><h1>撤回你提交的报告</h1><p class="muted">也可以在 FanBar 的上报记录中撤回。删除后，报告不再被公开查询，也不再计入在线社区统计。</p><form id="withdraw" class="card panel"><label class="field">报告编号<input id="reportID" required maxlength="36" autocomplete="off"></label><label class="field">撤回凭证<input id="token" type="password" required maxlength="43" autocomplete="off"></label><p class="small muted">凭证只通过加密请求发送，不写入网址或浏览器存储。请勿将凭证放进公开反馈。</p><div class="actions"><button class="primary">确认撤回报告</button></div><p id="status" class="message" role="status"></p></form><p class="small muted">在线删除不代表云平台历史恢复点立即清除，详见处理规则。</p></main></body></html>
