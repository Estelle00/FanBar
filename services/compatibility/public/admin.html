<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报告审核 · FanBar</title><link rel="stylesheet" href="/app.css"><script type="module" src="/admin.js"></script></head><body><header><div class="header"><a class="brand" href="/"><img src="/fanbar.png" alt="FanBar"><span>FanBar<small>报告审核 · 管理员</small></span></a><nav><a href="/">公开兼容性页 ↗</a><a href="/privacy.html">处理规则</a></nav></div></header><main class="main"><div class="intro"><div><div class="overline">REVIEW / EVIDENCE</div><h1>把报告变成可信的兼容性记录。</h1><p>审核通过只纳入社区统计。开发者验证需要独立实测与公开依据，不能由用户请求成功自动推导。</p></div><span class="badge">原始报告默认私有</span></div><form id="login" class="login"><label class="field">管理员访问密钥<input id="adminToken" type="password" autocomplete="off"></label><button>进入审核后台</button></form><div class="search card"><label for="filter" class="small">审核状态</label><select id="filter"><option value="pending">待审核</option><option value="approved">已纳入统计</option><option value="rejected">已排除</option><option value="all">全部</option></select><input id="filterModel" placeholder="按机型标识筛选" maxlength="64"><input id="filterVersion" placeholder="FanBar 版本" maxlength="40"><button id="refresh">查询</button></div><p id="status" class="message" role="status"></p><div class="split"><section class="card"><div id="list" class="list"></div><div class="pager"><button id="previous">上一页</button><button id="next">下一页</button><span id="page" class="small muted"></span></div></section><section id="detail" class="card detail"><div class="empty"><h2>选择一份报告</h2><p>查看具体字段，再决定是否纳入社区统计。</p></div></section></div><section class="card panel"><details><summary>发布独立实测记录</summary><p class="small muted">完成对应功能的实际测试后填写。此记录长期公开，附带来源；填写“手动调速可用”需要实际控制证据。</p><form id="verification" class="formgrid"><label class="field">机型标识<input name="modelIdentifier" required maxlength="64"></label><label class="field">macOS 版本<input name="macOSVersion" required maxlength="40"></label><label class="field">FanBar 版本<input name="appVersion" required maxlength="40"></label><label class="field">Helper 版本<input name="helperVersion" required maxlength="40"></label><label class="field">实测能力<select name="capability"><option value="cpuTemperature">CPU 温度</option><option value="gpuTemperature">GPU 温度</option><option value="ssdTemperature">SSD 温度</option><option value="batteryTemperature">电池温度</option><option value="fanReadings">风扇读取</option><option value="manualControl">手动调速</option><option value="smartCooling">智能温控</option></select></label><label class="field">测试结果<select name="status"><option value="verifiedAvailable">实测可用</option><option value="verifiedUnsupported">实测不支持</option></select></label><label class="field">验证日期<input type="date" name="verifiedOn" required></label><label class="field">公开依据 URL<input type="url" name="sourceURL" required placeholder="https://…"></label><label class="field full">验证说明<textarea name="notes" required maxlength="500"></textarea></label><div class="full"><button class="primary">发布实测记录</button><span id="verificationStatus" class="small muted"></span></div></form></details></section><section class="card panel"><details><summary>撤下错误的实测记录</summary><p class="small muted">公开 JSON 中每条开发者验证含记录编号。撤下不会删除用户报告。</p><form id="removeVerification" class="actions"><label class="field">验证记录编号<input id="verificationID" required maxlength="36"></label><button>撤下记录</button></form></details></section></main></body></html>
